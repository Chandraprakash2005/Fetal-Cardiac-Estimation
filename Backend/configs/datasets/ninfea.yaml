# configs/datasets/ninfea.yaml
# Merged on top of configs/default.yaml when --dataset ninfea is selected.

dataset:
  name: ninfea
  physionet_id: ninfea/1.0.0
  loader: wfdb                      # src/fcac/io/ninfea.py, via wfdb
  raw_dir: data/raw/ninfea
  interim_dir: data/interim/ninfea

  native_fs_hz: 2048
  n_subjects: 39
  n_recordings: 60
  abdominal_channel_prefix: uni_abd  # 24 abdominal unipolar channels
  non_physiological_channels: ["dc1", "dc2", "dc3", "dc4", "saw", "sync"]

  fetal_reference: doppler           # synchronised pulsed-wave Doppler beat timing
  has_scalp_ecg: false               # no amplitude ground truth -- timing metrics only

  # Doppler beat timing (src/fcac/io/ninfea_doppler.py). The Doppler ships only as bitmaps:
  # pwd_images/<n>.bmp, 284 image columns per second, same time origin as the ECG (the dataset's
  # own viewer Interfaccia_dataset.m: fs_doppler=284, tempo_doppler=(0:len-1)/fs_doppler).
  doppler:
    images_dir: data/raw/ninfea_pwd/pwd_images
    cache_dir: data/interim/ninfea_doppler
    fs_doppler: 284
    smooth_s: 0.03
    min_beat_interval_s: 0.3        # 200 bpm ceiling
    prominence_frac: 0.25           # peak prominence as a fraction of the envelope's 10-90 pct range

  ga_days:
    # Real per-record gestational age (weeks converted to days: week*7 + extra_days),
    # sourced from Table 3 ("Clinical information about mothers and foetuses") in the
    # dataset's own companion paper: Sulas et al. 2021, "A non-invasive multimodal
    # foetal ECG-Doppler dataset for antenatal cardiology research", Scientific Data
    # 8:30, https://doi.org/10.1038/s41597-021-00811-3 (PMC7838287). NOT in the
    # PhysioNet page or the .hea headers -- only in this paper's main-text table.
    # 2026-09-30: transcribed via two WebFetch calls (signals 1-30, 31-60) reading
    # only the "Gestational week" column; not independently re-verified against the
    # published PDF/HTML table -- spot-check before treating as final.
